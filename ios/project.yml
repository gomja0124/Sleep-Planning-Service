name: Bamgai
options:
  bundleIdPrefix: com.somni
  deploymentTarget:
    iOS: "16.0"
targets:
  Bamgai:
    type: application
    platform: iOS
    sources: [Bamgai]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bamgai.app
        INFOPLIST_FILE: Bamgai/Info.plist
        CODE_SIGN_STYLE: Automatic
    info:
      path: Bamgai/Info.plist
      properties:
        CFBundleDisplayName: 밤가이
        NSCalendarsFullAccessUsageDescription: 밤가이가 다음 일정에 맞춰 취침 및 기상 계획을 추천하기 위해 캘린더를 읽습니다.
        NSCalendarsUsageDescription: 밤가이가 다음 일정에 맞춰 취침 및 기상 계획을 추천하기 위해 캘린더를 읽습니다.
        SOMNI_BASE_URL: http://localhost:4173
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
