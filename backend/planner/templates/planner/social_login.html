<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>밤가이 로그인</title><style>body{margin:0;display:grid;min-height:100vh;place-items:center;background:#101426;color:#f8f7ff;font:16px system-ui,sans-serif}.card{width:min(360px,calc(100vw - 48px));padding:36px;border-radius:24px;background:#1b2140}.login{width:100%;margin:10px 0;padding:14px;border:0;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}.google{background:#fff;color:#222}.apple{background:#050505;color:#fff}.disabled{opacity:.5;cursor:not-allowed}</style></head><body><main class="card"><p>밤가이 · 나만의 수면 리듬</p><h1>로그인하고<br>내 리듬을 저장하세요</h1><p>Google 또는 Apple 계정으로 안전하게 시작할 수 있어요.</p>{% if providers.google %}<form method="post" action="/accounts/google/login/">{% csrf_token %}<button class="login google">Google로 계속하기</button></form>{% else %}<button class="login google disabled" disabled>Google 로그인 설정 필요</button>{% endif %}{% if providers.apple %}<form method="post" action="/accounts/apple/login/">{% csrf_token %}<button class="login apple">Apple로 계속하기</button></form>{% else %}<button class="login apple disabled" disabled>Apple 로그인 설정 필요</button>{% endif %}</main></body></html>
