<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>로그인 완료 · 밤가이</title><style>body{margin:0;display:grid;min-height:100vh;place-items:center;background:#101426;color:#f8f7ff;font:16px system-ui,sans-serif}.card{width:min(420px,calc(100vw - 48px));padding:36px;border-radius:24px;background:#1b2140}a,button{display:block;width:100%;box-sizing:border-box;margin-top:12px;padding:13px;border:0;border-radius:12px;background:#fff;color:#151729;text-align:center;font-weight:700;text-decoration:none}button{background:transparent;color:#d8dcf1;border:1px solid #7780ad}</style></head><body><main class="card"><p>로그인 완료</p><h1>{{ profile.name }}님, 환영해요.</h1><p>수면 데이터는 현재 로그인한 계정에만 저장됩니다.</p><a href="/api/v1/me/">내 API 데이터 보기</a><form method="post" action="/accounts/logout/">{% csrf_token %}<button>로그아웃</button></form></main></body></html>
